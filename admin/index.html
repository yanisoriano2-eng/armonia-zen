<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel · Armonía Zen</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- LOGIN -->
    <div class="login-wrap" id="login">
        <div class="login-card">
            <span class="brand">ARMONÍA ZEN</span>
            <span class="brand-sub">Panel de administración</span>

            <div id="login-view">
                <h1>Bienvenido</h1>
                <p class="muted">Ingresá con tu cuenta para administrar la web.</p>
                <div class="login-error" id="login-error"></div>
                <form id="login-form">
                    <div class="fld"><label>Email</label><input type="email" id="li-email" required autocomplete="username"></div>
                    <div class="fld"><label>Contraseña</label><input type="password" id="li-pass" required autocomplete="current-password"></div>
                    <label class="switch" style="margin:6px 0 22px;"><input type="checkbox" id="li-remember" checked><span class="track"></span><span class="lbl">Recordarme</span></label>
                    <button class="btn btn--gold" type="submit" style="width:100%; justify-content:center;">Ingresar</button>
                </form>
                <p style="text-align:center; margin-top:16px;"><button class="link-btn" id="to-recover">¿Olvidaste tu contraseña?</button></p>
                <p class="login-hint">Acceso de prueba:<br><code>admin@armoniazen.com</code> · <code>armonia2026</code></p>
            </div>

            <div id="recover-view" style="display:none;">
                <h1>Recuperar acceso</h1>
                <p class="muted">Ingresá tu email y una nueva contraseña.</p>
                <div class="login-error" id="recover-error"></div>
                <form id="recover-form">
                    <div class="fld"><label>Email</label><input type="email" id="rec-email" required></div>
                    <div class="fld"><label>Nueva contraseña</label><input type="password" id="rec-pass" required minlength="6"></div>
                    <button class="btn btn--gold" type="submit" style="width:100%; justify-content:center; margin-top:8px;">Actualizar contraseña</button>
                </form>
                <p style="text-align:center; margin-top:16px;"><button class="link-btn" id="to-login">Volver al ingreso</button></p>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div class="app" id="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__brand"><b>ARMONÍA ZEN</b><span>Admin</span></div>
            <nav id="nav"></nav>
            <div class="sidebar__foot">
                <div class="sidebar__user" id="side-user"></div>
                <button class="btn btn--ghost btn--sm" id="logout" style="margin-top:12px; width:100%; justify-content:center;">Cerrar sesión</button>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:14px;">
                    <button class="btn btn--sm menu-btn" id="menu-btn">☰</button>
                    <div>
                        <h2 id="page-title">Dashboard</h2>
                        <div class="sub" id="page-sub"></div>
                    </div>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn--sm" id="view-site">Ver web ↗</button>
                    <button class="btn btn--sm" id="publish">Publicar / Backup</button>
                </div>
            </header>
            <div class="content" id="content"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-title">Confirmar</h3>
            <p id="modal-text"></p>
            <div class="modal-foot">
                <button class="btn btn--ghost" id="modal-cancel">Cancelar</button>
                <button class="btn btn--danger" id="modal-ok">Eliminar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/store.js"></script>
    <script src="admin.js"></script>
</body>
</html>
